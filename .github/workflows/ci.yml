name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'LICENSE'
      - 'LICENSE.*'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ProjectPilot
    env:
      TZ: UTC
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
      RESULT_BUNDLE: ${{ github.workspace }}/TestResults/ProjectPilot.xcresult
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: ProjectPilot

      - name: Checkout shared TickCore package
        uses: actions/checkout@v5
        with:
          repository: donnoel/Tick
          ref: d7f069776152b0dca33b14a8d6f60470419a9f74
          path: Tick

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project ProjectPilot.xcodeproj

      - name: Show environment
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -project ProjectPilot.xcodeproj -scheme ProjectPilot -showdestinations

      - name: Build for testing
        run: bash scripts/ci.sh build

      - name: Unit tests
        run: bash scripts/ci.sh unit

      - name: UI tests
        run: bash scripts/ci.sh ui

      - name: Upload xcodebuild artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-artifacts
          path: |
            ${{ env.RESULT_BUNDLE }}
            TestResults/**/*.xcresult
            ${{ env.DERIVED_DATA }}/Logs/Test
